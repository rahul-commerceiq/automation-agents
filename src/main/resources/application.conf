[spark]
app_name = SizeCalculationJob
master = local[*]
executor_memory = 2g
driver_memory = 1g
executor_cores = 2

[data]
input_format = parquet
output_format = parquet
input_path = /tmp/input
output_path = /tmp/output

[calculation]
size_column = size
group_by_columns = category
calculate_percentiles = true
percentiles = 25,50,75,90,95,99