spark {
  app-name = "Data Size Calculator"
  
  # Default configuration
  default {
    input-path = "/data/input"
    output-path = "/data/output"
    output-format = "json"  # json, csv, parquet
    partition-size = 128  # MB
  }
  
  # Data source configurations
  sources {
    hdfs {
      namenode = "hdfs://localhost:9000"
      block-size = 134217728  # 128MB
    }
    
    s3 {
      access-key = ${?AWS_ACCESS_KEY_ID}
      secret-key = ${?AWS_SECRET_ACCESS_KEY}
      region = "us-west-2"
      bucket = ${?S3_BUCKET}
    }
    
    local {
      base-path = "/tmp/data"
    }
  }
  
  # Size calculation settings
  calculation {
    include-hidden-files = false
    recursive = true
    calculate-checksums = false
    group-by-extension = true
  }
  
  # Performance tuning
  performance {
    parallelism = 4
    max-records-per-file = 1000000
    cache-intermediate-results = true
  }
}